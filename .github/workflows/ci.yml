name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MIX_ENV: test

jobs:
  # Compile + test across the supported Elixir/OTP range.
  test:
    name: Test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.19"
            otp: "27"
          - elixir: "1.19"
            otp: "28"
          - elixir: "1.20"
            otp: "28"
          - elixir: "1.20"
            otp: "29"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Elixir / OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Cache deps and _build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test --warnings-as-errors

  # Version-independent checks — run once.
  quality:
    name: Quality (format · credo · sobelow · audits)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The version-independent jobs run on the toolchain .tool-versions pins,
      # because `mix format` output is version-sensitive: checking formatting on
      # a different release than everyone formats with fails for no real reason.
      - name: Set up Elixir / OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - name: Cache deps and _build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-quality-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-quality-

      - name: Install dependencies
        run: mix deps.get

      - name: Check for unused dependencies in mix.lock
        run: mix deps.unlock --check-unused

      # !cancelled() so one run surfaces every failure, not just the first.
      - name: Check formatting
        if: ${{ !cancelled() }}
        run: mix format --check-formatted

      # A message the catalogue lacks shows untranslated in every locale.
      - name: Gettext catalogue is up to date
        if: ${{ !cancelled() }}
        run: mix gettext.extract --check-up-to-date

      - name: Static analysis (Credo)
        if: ${{ !cancelled() }}
        run: mix credo

      - name: Security analysis (Sobelow)
        if: ${{ !cancelled() }}
        run: mix sobelow

      - name: Dependency vulnerability audit (mix deps.audit)
        if: ${{ !cancelled() }}
        run: mix deps.audit

      - name: Retired package audit (mix hex.audit)
        if: ${{ !cancelled() }}
        run: mix hex.audit

  # The DSL extensions export a formatter config; a hand-edited .formatter.exs
  # that no longer matches them would silently reformat a host's code wrong.
  spark-formatter:
    name: Spark formatter is up to date
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The version-independent jobs run on the toolchain .tool-versions pins,
      # because `mix format` output is version-sensitive: checking formatting on
      # a different release than everyone formats with fails for no real reason.
      - name: Set up Elixir / OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - name: Cache deps and _build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-quality-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-quality-

      - name: Install dependencies
        run: mix deps.get

      - name: Check .formatter.exs against the DSL extensions
        run: mix spark.formatter --check --extensions AshQuick,AshQuick.Nav.Dsl

  # The library has no Repo, endpoint or router of its own, so the paths that
  # only exist inside a real host app are exercised only through example/. Run
  # its suite (via mix coveralls, which also reports library coverage — see
  # example/test/test_helper.exs).
  example-test:
    name: Test + coverage (example app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example
    services:
      db:
        # PG 18+: migrations default primary keys to the built-in uuidv7().
        image: postgres:18
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Elixir / OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - name: Cache example deps and _build
        uses: actions/cache@v6
        with:
          path: |
            example/deps
            example/_build
          key: ${{ runner.os }}-mix-example-test-${{ hashFiles('example/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-example-test-

      # config/test.exs connects to host "db"; point it at the service.
      - name: Map the "db" host to localhost
        run: echo "127.0.0.1 db" | sudo tee -a /etc/hosts

      - name: Install example dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      # Migrations and resource snapshots match the resources and the
      # installed extensions: a resource change, or a dependency bump that
      # ships a new Postgres extension version, without its generated
      # migration fails here rather than at the dev server's codegen check.
      - name: Generated code is up to date
        run: mix ash.codegen --check

      # The compliance check the library ships, in the job it exists for: this
      # app is the worked example of a host that has reached zero and stays
      # there.
      - name: AshQuick compliance (strict)
        run: mix ash_quick.check --strict

      # The template the app translates AshQuick in, labels included: a field,
      # action or nav entry added without regenerating it fails here. In dev,
      # where it is generated: the test router also serves fixture pages.
      - name: AshQuick translation template is up to date
        run: mix ash_quick.gen.gettext --check
        env:
          MIX_ENV: dev

      # Localize ships English data alone; the Arabic pages' dates and money
      # need the rest, fetched like deps rather than committed. Cached on the
      # lock (Localize's version) and the config (the locale list).
      - name: Cache Localize locale data
        uses: actions/cache@v6
        with:
          path: example/priv/localize
          key: ${{ runner.os }}-localize-${{ hashFiles('example/mix.lock', 'example/config/config.exs') }}

      - name: Download Localize locale data
        run: mix localize.download_locales

      - name: Set up the test database
        run: mix ash.setup

      - name: Run tests + coverage
        run: mix coveralls

  # AshQuick's own JavaScript in a real browser: the picker's hook above all,
  # whose keyboard, focus and right-to-left drawing no LiveViewTest reaches.
  # Chromium through Playwright, the version example/assets/package-lock.json
  # pins. See example/test/support/browser_case.ex.
  browser:
    name: Browser tests (example app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Elixir / OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: example/assets/package-lock.json

      - name: Cache example deps and _build
        uses: actions/cache@v6
        with:
          path: |
            example/deps
            example/_build
          key: ${{ runner.os }}-mix-example-test-${{ hashFiles('example/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-example-test-

      - name: Map the "db" host to localhost
        run: echo "127.0.0.1 db" | sudo tee -a /etc/hosts

      - name: Install example dependencies
        run: mix deps.get

      - name: Install Playwright
        run: npm ci --prefix assets

      - name: Install Chromium
        working-directory: example/assets
        run: npx playwright install --with-deps --only-shell chromium

      - name: Cache Localize locale data
        uses: actions/cache@v6
        with:
          path: example/priv/localize
          key: ${{ runner.os }}-localize-${{ hashFiles('example/mix.lock', 'example/config/config.exs') }}

      - name: Download Localize locale data
        run: mix localize.download_locales

      # The pages load the app's CSS and JavaScript, AshQuick's hooks in it.
      - name: Build assets
        run: mix do assets.setup + assets.build

      - name: Set up the test database
        run: mix ash.setup

      # A failure runs the failed tests once more, keeping a trace and a
      # screenshot of each, and still fails the job.
      - name: Run browser tests
        run: |
          mix test --only playwright && exit 0
          PW_TRACE=true PW_SCREENSHOT=true mix test --only playwright --failed
          exit 1

      - name: Keep traces and screenshots of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-failures
          path: |
            example/traces
            example/screenshots
          if-no-files-found: ignore

  # AshQuick.Storage.S3 and S3.Proxy against a real S3-compatible server
  # rather than the example's stub: signing, key encoding, multipart uploads,
  # bucket policies and ranged reads, in both URL styles. The server is
  # SeaweedFS (Apache 2.0), from its published image. See
  # example/test/example/s3_server_test.exs.
  s3-server:
    name: S3 storage against SeaweedFS (example app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example
    env:
      SEAWEEDFS_IMAGE: chrislusf/seaweedfs:4.54@sha256:4b42c212543a0acd4c0e675215ecdcaf62a186ef98def76c7e12701871222d15
      S3_ENDPOINT: http://localhost:8333
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # -s3.domainName makes it answer virtual-hosted URLs too, and the hosts
      # entry makes the bucket's name resolve.
      - name: Start SeaweedFS
        run: |
          echo "127.0.0.1 ash-quick-s3.localhost" | sudo tee -a /etc/hosts
          docker run -d --name seaweedfs -p 8333:8333 \
            -v "$PWD/test/support/seaweedfs_s3.json:/etc/s3.json:ro" \
            "$SEAWEEDFS_IMAGE" server -s3 -s3.config=/etc/s3.json -s3.domainName=localhost
          for _ in $(seq 60); do
            curl -sf http://localhost:8333/healthz && exit 0
            sleep 1
          done
          docker logs seaweedfs
          exit 1

      - name: Set up Elixir / OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - name: Cache example deps and _build
        uses: actions/cache@v6
        with:
          path: |
            example/deps
            example/_build
          key: ${{ runner.os }}-mix-example-test-${{ hashFiles('example/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-example-test-

      - name: Map the "db" host to localhost
        run: echo "127.0.0.1 db" | sudo tee -a /etc/hosts

      - name: Install example dependencies
        run: mix deps.get

      - name: Run the S3 server cases
        run: mix test --only s3_server

  # Scan the example app's real router and endpoint — coverage the library, with
  # neither of its own, cannot get. Sobelow is installed as an archive because
  # the example app does not carry it as a dependency. See example/.sobelow-conf.
  sobelow-example:
    name: Sobelow (example app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Elixir / OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - name: Cache example deps and _build
        uses: actions/cache@v6
        with:
          path: |
            example/deps
            example/_build
          key: ${{ runner.os }}-mix-example-${{ hashFiles('example/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-example-

      - name: Install Sobelow (archive)
        run: mix archive.install hex sobelow 0.19.0 --force

      - name: Install example dependencies
        run: mix deps.get

      - name: Security analysis (Sobelow, example router/endpoint)
        run: mix sobelow
